name = "extra_coarse"
description = "Low sensitivity: much wider, taller lines and wider gaps (about 2 times standard)."
min_line_width_mm = 2.4
min_line_height_mm = 1.2
min_parallel_spacing_mm = 6.0
min_feature_length_mm = 8.0
min_relief_mm = 16.0
target_relief_mm = 24.0
simplify_mm = 0.3
distinguishable_profiles = ["rounded", "flat_top"]
label_mode = "numerals"
label_height_mm = 16.0
label_stroke_mm = 3.0
label_relief_mm = 2.0
notch_width_mm = 6.0
notch_depth_mm = 4.0

[lines]
rounded_major = { profile = "rounded", width_mm = 3.2, height_mm = 2.0 }
rounded_minor = { profile = "rounded", width_mm = 2.4, height_mm = 1.4 }
flat_top = { profile = "flat_top", width_mm = 4.0, height_mm = 3.0 }
pointed = { profile = "pointed", width_mm = 2.4, height_mm = 2.4 }

[sampler]
sample_length_mm = 25.0
pair_gap_mm = 12.0
widths_mm = [2.0, 2.4, 3.2, 4.0, 5.0]
heights_mm = [1.0, 1.4, 2.0, 3.0]
spacings_mm = [12.0, 9.0, 6.0, 4.0, 3.0]
